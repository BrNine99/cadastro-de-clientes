<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Clientes</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>    
</head>
<body>
    <main>
        <!-- Seção de cadastro -->
         <section>
            <h2 id="titulo-cadastro">Cadastrar Clientes</h2>

            <form id="form-cliente">
                <div>
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome do cliente" required>
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite o e-mail do cliente" required>
                </div>

                <button type="submit">Cadastrar Cliente</button>
            </form>
         </section>

        <!-- Seção de cadastro -->
         <section>
            <h2 id="titulo-listagem">Clientes Cadastrados</h2>

            <ul id="lista-clientes">
                <!-- Clientes inseridos dinamicamente pelo JS -->
            </ul>

            <p id="lista-vazia" hidden>Nenhum cliente cadastrado.</p>
         </section>

        <footer>
            <p>Sistema de Gerenciamento de Clientes</p>
        </footer>        
    </main>
    
</body>
</html>
